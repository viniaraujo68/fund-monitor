name: daily

on:
  schedule:
    - cron: "17 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Sao_Paulo
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: uv sync --frozen

      - name: Run pipeline tests
        working-directory: pipeline
        run: uv run --frozen pytest -q

      - name: Run pipeline
        working-directory: pipeline
        run: uv run --frozen python -m fund_monitor.run

      - name: Commit updated data
        run: |
          git add data/parquet data/site
          if git diff --cached --quiet -- . ':(exclude)data/site/meta.json'; then
            echo "No data changes"
            exit 0
          fi
          as_of=$(jq -r .as_of data/site/meta.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza dados até ${as_of}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        env:
          BASE_PATH: /fund-monitor
        run: npm run build

      - name: Check site build output
        run: test -f web/build/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
