<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f5bd3'/><path d='M7 22l6-6 4 4 8-9' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(() => {
				const stored = /(?:^|;\s*)theme=(light|dark)\b/.exec(document.cookie);
				if (stored) document.documentElement.dataset.theme = `plinth-${stored[1]}`;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
