[project]
name = "fund-monitor"
version = "0.1.0"
description = "Collection, calculation and publication pipeline for the fund monitor"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
